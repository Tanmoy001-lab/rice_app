<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Streamlit Firebase Auth</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: flex-start; align-items: flex-start; overflow: hidden; background-color: transparent;}
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button:hover { background-color: #f5f5f5; }
        img { width: 18px; height: 18px; }
    </style>
</head>
<body>

<button id="login-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Sign in with Google
</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    let app = null;
    let auth = null;
    let provider = null;

    // Streamlit Bridge Messages
    function sendValueMessage(value) {
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            apiVersion: 1,
            value: value
        }, "*");
    }

    function setFrameHeight(height) {
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            apiVersion: 1,
            height: height
        }, "*");
    }

    // Listen for data from Streamlit
    window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
            const data = event.data.args;
            if (!app && data.firebase_config && data.firebase_config.apiKey) {
                app = initializeApp({
                    apiKey: data.firebase_config.apiKey,
                    authDomain: data.firebase_config.authDomain,
                    projectId: data.firebase_config.projectId
                });
                auth = getAuth(app);
                provider = new GoogleAuthProvider();
                
                document.getElementById("login-btn").onclick = () => {
                    signInWithPopup(auth, provider).then((result) => {
                        sendValueMessage(result.user.email);
                    }).catch((err) => {
                        console.error(err);
                    });
                };
            }
            setFrameHeight(50);
        }
    });

    // Announce ready to Streamlit (apiVersion 1 is required)
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
    }, "*");
</script>

</body>
</html>
